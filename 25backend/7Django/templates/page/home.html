{% extends 'page/base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="mb-4">Welcome to Django Blog</h1>
    <p class="text-muted mb-4">블로그 프로젝트</p>

    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'blog:post_list' %}" class="btn btn-gradient btn-lg">
            Blog Home
        </a>

        {% if user.is_authenticated %}
            <a href="{% url 'blog:post_create' %}" class="btn btn-success btn-lg">
                글 작성
            </a>
        {% else %}
            <a href="{% url 'admin:login' %}" class="btn btn-outline-secondary btn-lg">
                로그인
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
